# GitHub에 push하거나 PR을 열면 새 구조(shared·server·edge)의 시험을 자동으로 돌린다.
# 서버 PC의 자동 업데이트(server/deploy/windows/update_server.ps1)도 반영 전에 같은 시험을 한 번 더 돌린다.
# server와 edge는 OpenCV 패키지가 달라(opencv-contrib-python / opencv-python-headless) 따로 설치한다.
# 서버 PC가 Windows라 windows 작업에서 배포 스크립트 문법·인코딩과 shared·server 시험을 Windows에서도 확인한다.
name: tests

# push는 main과 feat/** 브랜치만 돌린다(그 밖의 브랜치는 PR에서 한 번만 돌아 같은 시험이 두 번 돌지 않게).
on:
  push:
    branches: [main, "feat/**"]
  pull_request:

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: server/requirements.txt
      - run: pip install -r server/requirements.txt
      - name: shared 시험
        run: python -m unittest discover -s shared/tests -t . -v
      - name: server 시험 (모델 없이 대역으로)
        run: python -m unittest discover -s server/tests -t . -v

  edge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: edge/requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y libportaudio2
      - run: pip install -r edge/requirements.txt
      - name: edge 시험
        run: python -m unittest discover -s edge/tests -t . -v

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: 배포 스크립트 검사 (PowerShell 5.1 문법, 인코딩)
        shell: powershell
        # 실행 스크립트는 ASCII로만 쓴다(러너가 BOM 없이 저장하면 PowerShell 5.1이 한글을 잘못 읽는다).
        run: |
          # .ps1 needs a UTF-8 BOM (Korean text, Windows PowerShell 5.1); .bat must not have one (cmd).
          $bad = 0
          $scripts = @(Get-ChildItem server/deploy/windows -Filter *.ps1)
          if ($scripts.Count -eq 0) { Write-Host "::error::no .ps1 files in server/deploy/windows"; exit 1 }
          foreach ($f in $scripts) {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errors)
            foreach ($e in $errors) {
              Write-Host "::error file=server/deploy/windows/$($f.Name),line=$($e.Extent.StartLineNumber)::$($e.Message)"
              $bad++
            }
            $head = [IO.File]::ReadAllBytes($f.FullName)[0..2]
            if (-not ($head[0] -eq 0xEF -and $head[1] -eq 0xBB -and $head[2] -eq 0xBF)) {
              Write-Host "::error file=server/deploy/windows/$($f.Name)::missing UTF-8 BOM"
              $bad++
            }
          }
          foreach ($f in Get-ChildItem server/deploy/windows -Filter *.bat) {
            $head = [IO.File]::ReadAllBytes($f.FullName)[0..2]
            if ($head[0] -eq 0xEF -and $head[1] -eq 0xBB -and $head[2] -eq 0xBF) {
              Write-Host "::error file=server/deploy/windows/$($f.Name)::.bat must not start with a UTF-8 BOM"
              $bad++
            }
          }
          Write-Host "checked $($scripts.Count) PowerShell scripts, problems: $bad"
          if ($bad) { exit 1 }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: server/requirements.txt
      - run: pip install -r server/requirements.txt
      - name: shared 시험 (Windows)
        run: python -m unittest discover -s shared/tests -t . -v
      - name: server 시험 (Windows, 모델 없이 대역으로)
        run: python -m unittest discover -s server/tests -t . -v
