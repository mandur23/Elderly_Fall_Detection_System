# edge 설정 예시. edge/config.toml로 복사해서 고칩니다 (config.toml은 저장소에 올리지 않습니다).
# 명령행 인자가 이 파일보다 우선합니다:  python -m edge --help

[server]
# PC 서버 주소. "192.168.0.10", "192.168.0.10:8000", "ws://192.168.0.10:8000/ws/device" 모두 됩니다.
# 포트를 생략하면 8000입니다.
address = "192.168.0.10"
# 서버에 등록한 장치 토큰(DEVICE_TOKEN). 다른 사람이 볼 수 없게 이 파일 권한을 600으로 둡니다.
token = "__DEVICE_TOKEN__"

[device]
id = "living-room"   # 장치 구분자 (서버에 같은 값이 두 개 있으면 안 됨). 비우면 컴퓨터 이름
name = "거실"         # 설치 위치 (사람이 읽는 이름)

[camera]
backend = "auto"     # auto | picamera2 | opencv | none. auto는 라즈베리파이 카메라가 있으면 picamera2
# source = 0         # USB 웹캠 번호 또는 시험용 영상 파일 경로. 생략하면 기본 카메라
rotation = 0         # 0 | 90 | 180 | 270 (시계 방향). 카메라를 돌려 달았을 때
loop_file = true     # 영상 파일이 끝나면 처음부터 다시

[microphone]
enabled = true
device = ""          # 비우면 기본 장치. 번호 또는 이름 일부 (python -m edge --list-devices)

[speaker]
backend = "sounddevice"   # sounddevice | null (소리를 내지 않는 시험용)
device = ""               # 비우면 기본 장치
volume = 1.0              # 0.0 ~ 1.0

[log]
level = "INFO"       # DEBUG | INFO | WARNING | ERROR
