<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>낙상 감지 현장 화면 - 서버 연결 중</title>
  <!--
    키오스크(kiosk.sh)가 켜자마자 여는 대기 화면. 라즈베리파이 안의 파일이라 서버가 아직 꺼져 있어도 바로 보인다.
    주소 뒤의 값은 kiosk.sh가 python -m edge --print-url waiting으로 만든다:
      kiosk  현장 화면 주소 (http://<서버>:8000/kiosk?device=...&key=...)
      health 서버가 떠 있는지 확인할 주소 (/api/health)
      name   장치 이름, server 서버 주소 (보여 주기만 함)
      error  설정을 읽을 수 없을 때의 설명 ('설정이 필요합니다'를 보이고 서버를 확인하지 않음)
    2초마다 health를 확인해 서버가 어떤 응답이든 하면 현장 화면으로 넘어간다. 외부 파일을 쓰지 않는다.
  -->
  <style>
    /* 현장 화면(server/static/kiosk.css)과 같은 글꼴·색: 연결 끊김은 회색, 설정 오류는 어두운 호박색 */
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Pretendard", "Noto Sans KR", "Noto Sans CJK KR", "NanumGothic", "Malgun Gothic", sans-serif;
      height: 100vh;
      overflow: hidden;
      user-select: none;
      background: #4d5656;
      color: #fff;
    }
    body.view-error { background: #8a5a00; }

    .screen { display: flex; flex-direction: column; height: 100vh; padding: 16px 24px; }
    .top { display: flex; justify-content: space-between; gap: 16px; font-size: 1.4rem; opacity: 0.9; }

    .center {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      text-align: center;
      min-height: 0;
    }
    h1 { font-size: clamp(2.5rem, 7vw, 4.5rem); font-weight: 800; }
    .desc { font-size: clamp(1.3rem, 3vw, 2rem); max-width: 1100px; line-height: 1.4; }

    .spinner {
      width: 72px;
      height: 72px;
      border: 8px solid rgba(255, 255, 255, 0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 1.2s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 4s; } }
    .view-error .spinner { display: none; }

    .info {
      display: grid;
      grid-template-columns: auto auto;
      gap: 6px 24px;
      font-size: clamp(1.2rem, 2.6vw, 1.7rem);
      background: rgba(0, 0, 0, 0.2);
      border-radius: 12px;
      padding: 14px 28px;
      text-align: left;
    }
    .info dt { opacity: 0.8; }
    .info dd { font-weight: 700; word-break: break-all; }

    .hint {
      font-size: clamp(1.2rem, 2.6vw, 1.7rem);
      background: rgba(0, 0, 0, 0.25);
      border-radius: 12px;
      padding: 12px 20px;
      max-width: 1100px;
      line-height: 1.4;
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="screen">
    <header class="top">
      <span id="clock">--:--:--</span>
      <span id="location"></span>
      <span></span>
    </header>

    <main class="center">
      <div class="spinner" aria-hidden="true"></div>
      <h1 id="title">서버에 연결하는 중입니다</h1>
      <p id="desc" class="desc">잠시만 기다려 주세요. 연결되면 현장 화면이 저절로 열립니다.</p>
      <dl class="info">
        <dt>장치</dt><dd id="device">-</dd>
        <dt>서버</dt><dd id="server">-</dd>
        <dt id="elapsed-label">기다린 시간</dt><dd id="elapsed">0초</dd>
      </dl>
      <p id="hint" class="hint hidden"></p>
    </main>
  </div>

  <script>
    "use strict";

    const POLL_MS = 2000;        // 서버 확인 간격
    const TIMEOUT_MS = 3000;     // 확인 요청 하나의 시간 제한
    const HINT_AFTER_S = 60;     // 이만큼 기다려도 연결되지 않으면 확인할 것을 보인다
    const SLOW_HINT = "서버 PC가 켜져 있는지, 라즈베리파이와 같은 공유기(네트워크)에 연결되어 있는지 확인해 주세요. " +
      "서버가 응답하면 현장 화면이 저절로 열립니다.";
    const CONFIG_HINT = "edge/config.toml에 서버 주소와 장치 토큰을 넣거나, 관리자 화면의 '라즈베리파이 추가' 명령을 " +
      "이 라즈베리파이에서 다시 실행해 주세요. 설정이 바뀌면 화면이 저절로 바뀝니다.";
    // kiosk.sh가 python을 실행하지 못했을 때 붙이는 값
    const ERROR_TEXT = { venv: "edge 프로그램(.venv)을 실행할 수 없습니다. 설치 명령을 다시 실행해 주세요." };

    const $ = (id) => document.getElementById(id);
    const params = new URLSearchParams(location.search);
    const kioskUrl = params.get("kiosk") || "";
    const healthUrl = params.get("health") || "";
    const started = Date.now();

    // 현장 화면·health 주소는 http(s)만 쓴다 (다른 주소로 넘어가지 않게).
    function isHttp(url) {
      try {
        const u = new URL(url);
        return u.protocol === "http:" || u.protocol === "https:";
      } catch (err) {
        return false;
      }
    }

    function timeoutSignal(ms) {
      if (typeof AbortSignal !== "undefined" && typeof AbortSignal.timeout === "function") {
        return AbortSignal.timeout(ms);
      }
      const ctrl = new AbortController();
      setTimeout(() => ctrl.abort(), ms);
      return ctrl.signal;
    }

    function formatElapsed(seconds) {
      const m = Math.floor(seconds / 60);
      const s = seconds % 60;
      return m ? `${m}분 ${s}초` : `${s}초`;
    }

    function tick() {
      const d = new Date();
      $("clock").textContent = [d.getHours(), d.getMinutes(), d.getSeconds()]
        .map((n) => String(n).padStart(2, "0")).join(":");
      const waited = Math.floor((Date.now() - started) / 1000);
      $("elapsed").textContent = formatElapsed(waited);
      if (!document.body.classList.contains("view-error") && waited >= HINT_AFTER_S) {
        $("hint").textContent = SLOW_HINT;
        $("hint").classList.remove("hidden");
      }
    }

    function showError(text) {
      document.body.classList.add("view-error");
      document.title = "낙상 감지 현장 화면 - 설정 필요";
      $("title").textContent = "설정이 필요합니다";
      $("desc").textContent = text;
      $("hint").textContent = CONFIG_HINT;
      $("hint").classList.remove("hidden");
      $("elapsed-label").classList.add("hidden");
      $("elapsed").classList.add("hidden");
    }

    // 서버가 어떤 응답이든 하면 현장 화면으로 넘어간다. no-cors라 응답 내용은 볼 수 없지만,
    // 서버가 응답하면 성공하고 닿지 않으면(꺼짐·주소 틀림·시간 초과) 실패한다.
    async function check() {
      try {
        await fetch(healthUrl, { mode: "no-cors", cache: "no-store", signal: timeoutSignal(TIMEOUT_MS) });
        location.replace(kioskUrl);
        return;
      } catch (err) {
        // 아직 서버가 응답하지 않음. 잠시 뒤 다시 본다
      }
      setTimeout(check, POLL_MS);
    }

    const name = params.get("name");
    $("device").textContent = name || "-";
    $("location").textContent = name || "";
    $("server").textContent = params.get("server") || "-";

    const error = params.get("error");
    if (error) {
      showError(ERROR_TEXT[error] || error);
    } else if (!isHttp(kioskUrl) || !isHttp(healthUrl)) {
      showError("현장 화면 주소가 없습니다.");
    } else {
      check();
    }
    tick();
    setInterval(tick, 1000);
  </script>
</body>
</html>
