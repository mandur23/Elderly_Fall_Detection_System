<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>관리자 로그인</title>
  <link rel="stylesheet" href="/static/admin.css">
</head>
<body>
  <form class="center-box" method="post" action="/admin/login">
    <h1>낙상 감지 관리자</h1>
    <p class="muted">서버 설정의 관리자 비밀번호(admin_password)를 입력하세요.</p>
    <p id="error" class="error hidden">비밀번호가 맞지 않습니다.</p>
    <input type="password" name="password" autocomplete="current-password" placeholder="비밀번호" required autofocus>
    <button type="submit">로그인</button>
  </form>
  <script>
    if (new URLSearchParams(location.search).has("error")) {
      document.getElementById("error").classList.remove("hidden");
    }
  </script>
</body>
</html>
